name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (modo mock — sem dependências externas)
        run: npm run build

      - name: Lint
        run: npx eslint src

  backend:
    name: Backend (NestJS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: beehome
          POSTGRES_PASSWORD: beehome
          POSTGRES_DB: beehome_backend_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U beehome"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: "postgresql://beehome:beehome@localhost:5432/beehome_backend_test?schema=public"
      JWT_SECRET: "ci-test-secret"
      JWT_EXPIRES_IN: "1h"
      JWT_REFRESH_EXPIRES_IN: "7d"
      BEEHOME_BASE_URL: "https://ci-placeholder.beehome.example.com"
      BEEHOME_BEARER_TOKEN: "ci-placeholder-token"
      REDIS_URL: "redis://localhost:6379"
      SYNC_QUEUE_DRIVER: "memory"
      FRONTEND_URL: "http://localhost:3000"
      PORT: "3001"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Prisma validate
        run: npx prisma validate

      # Os testes atuais usam mocks/in-memory e não dependem de banco, mas o
      # serviço Postgres acima e este passo já deixam o pipeline pronto para
      # quando houver testes de integração reais (basta que passem a
      # depender de DATABASE_URL, já configurada nesta job).
      - name: Prisma migrate deploy
        run: npx prisma migrate deploy

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  e2e:
    name: E2E (Playwright, modo mock)
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests (modo mock — sem dependências externas)
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
